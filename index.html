<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>VCAM Installation Dashboard</title>
<style>
:root{--bg:#f6f7f9;--card:#fff;--tx:#1a1d23;--mu:#667085;--bd:#e3e6eb;--ac:#2563eb;--ok:#16a34a;--wa:#d97706;--no:#6b7280;--ho:#dc2626;color-scheme:light}
@media(prefers-color-scheme:dark){:root{--bg:#111317;--card:#1b1e24;--tx:#eef0f3;--mu:#98a2b3;--bd:#2d323b;--ac:#60a5fa;--ok:#4ade80;--wa:#fbbf24;--no:#9ca3af;--ho:#f87171;color-scheme:dark}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:14px/1.45 system-ui,-apple-system,Segoe UI,sans-serif}
main{max-width:1100px;margin:0 auto;padding:16px}h1{font-size:20px;margin:0}small,.mu{color:var(--mu)}
header{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.brand{display:flex;align-items:center;gap:12px}.brand img{height:48px;background:#fff;border-radius:8px;padding:4px 8px}
.live{font-size:12px;padding:3px 10px;border-radius:99px;border:1px solid var(--bd);background:var(--card)}
.live i{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--no);margin-right:6px}.live.on i{background:var(--ok)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin-bottom:12px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:12px}.kpi b{display:block;font-size:24px}
.bar{height:12px;border-radius:6px;background:var(--bd);overflow:hidden;display:flex;margin:8px 0}.bar span{display:block;height:100%;transition:width .3s}
.leg{display:flex;gap:12px;flex-wrap:wrap;font-size:12px}.leg i{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:4px}
.tools{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}
select,input,button{font:inherit;color:var(--tx);background:var(--card);border:1px solid var(--bd);border-radius:8px;padding:7px 10px}button{cursor:pointer}button.p{background:var(--ac);color:#fff;border-color:var(--ac)}
.wrap{overflow-x:auto}table{border-collapse:collapse;width:100%;min-width:820px}th,td{text-align:left;padding:8px;border-bottom:1px solid var(--bd);white-space:nowrap}th{font-size:12px;color:var(--mu)}
#err{display:none;background:var(--ho);color:#fff;padding:8px 12px;border-radius:8px;margin-bottom:10px}
dialog{border:1px solid var(--bd);border-radius:12px;background:var(--card);color:var(--tx);max-width:560px;width:94%}dialog::backdrop{background:#0008}dialog label{display:block;font-size:12px;color:var(--mu);margin-top:8px}dialog input,dialog select{width:100%}.g{display:grid;grid-template-columns:1fr 1fr;gap:0 10px}
</style></head><body><main>

<div><label>Supplier</label><input name="supplier"></div><div><label>Reflow model</label><input name="reflow"></div>
<div><label>Stopper P/N</label><input name="stopper"></div><div><label>Qty (blank = TBA)</label><input name="qty" type="number" min="0"></div>
<div><label>Planned date (blank = TBA)</label><input name="planned" type="date"></div><div><label>Engineer</label><input name="engineer"></div>
<div><label>Status</label><select name="status"><option>Not Started</option><option>In Progress</option><option>On Hold</option><option>Completed</option></select></div><div><label>PO</label><input name="po"></div>
</div><label>Remarks</label><input name="remark">
<div class="tools"><button class="p" value="save">Save</button><button value="cancel" formnovalidate>Cancel</button><button type="button" id="del" hidden style="color:var(--ho)">Delete</button></div></form></dialog>
<script>
// ====== CONFIG: fill these two, must match Code.gs ======
const CFG={SCRIPT_URL:"https://script.google.com/macros/s/AKfycbzXCE4qCXsMHzvQrv-l8lzR5lQTXaEhLJSIvO6-Mc1Igwowtj2wjcc6dz7RSRJkiCvhFg/exec",TOKEN:"TY1sCZBeTg5_mRk30Bje3FHjDkXwH_jN",REFRESH_MS:15000};
// ========================================================
const S=["Not Started","In Progress","On Hold","Completed"],C={"Not Started":"var(--no)","In Progress":"var(--wa)","On Hold":"var(--ho)","Completed":"var(--ok)"};
const $=id=>document.getElementById(id);let rows=[];
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const p2=n=>String(n).padStart(2,"0"),fmt=d=>d.getFullYear()+"-"+p2(d.getMonth()+1)+"-"+p2(d.getDate()),tdy=()=>fmt(new Date());
function ymd(s){s=String(s||"").trim();if(!s)return"";if(/^\d{4}-\d{2}-\d{2}/.test(s))return s.slice(0,10);const d=new Date(s);return isNaN(d)?"":fmt(d)}
const AL={"smt line":"line","machine":"supplier","pic":"owner","po status":"po","po done":"po_done","reflow":"model"};
function cn(r){const o={};for(const k in r){const c=AL[k.trim().toLowerCase()]||k.trim().toLowerCase();if(!(c in o))o[c]=r[k]}return o}
function norm(o){const tba=String(o.tba).toUpperCase()==="TRUE",d=ymd(o.date);return{id:o.id,customer:o.customer,project:o.project,site:o.site,line:o.line||o.p8||"",supplier:o.supplier,reflow:o.model,qty:o.qty,planned:tba?"":d,completed:ymd(o.actual),status:S.includes(o.status)?o.status:"In Progress",poDone:ymd(o.po_done),part:o.part,engineer:o.owner,po:o.po,rem:o.remarks,p8:o.p8,remark:[o.po,o.remarks,tba&&d?"TBA Dec (sheet date "+d+")":""].filter(Boolean).join(" · ")}}
function live(on,t){$("live").className="live"+(on?" on":"");$("live").lastChild.textContent=t}
function render(){
 const cs=[...new Set(rows.map(i=>i.customer).filter(Boolean))].sort(),cur=$("fc").value;
 $("fc").innerHTML='<option value="">All customers</option>'+cs.map(c=>`<option ${c===cur?"selected":""}>${esc(c)}</option>`).join("");
 const n=rows.length,cnt=s=>rows.filter(i=>i.status===s).length,units=rows.reduce((a,i)=>a+(+i.qty||0),0),tba=rows.filter(i=>i.qty==="").length,today=tdy();
 const od=rows.filter(i=>i.status!=="Completed"&&i.planned&&i.planned<today).length;
 const tj=rows.filter(i=>i.planned===today||i.completed===today),inst=rows.filter(i=>i.completed===today).length,dueT=rows.filter(i=>i.planned===today&&i.status!=="Completed").length,pct=tj.length?Math.round(inst/tj.length*100):0;
 const pend=rows.filter(i=>i.status!=="Completed"),pp=rows.filter(i=>!i.poDone).length,fu=pend.filter(i=>i.status==="On Hold"||!i.planned||i.planned<today).length,comp=n?Math.round((n-od)/n*100):0;
 $("today").innerHTML=`<div style="display:flex;justify-content:space-between;align-items:center;gap:12px"><div style="flex:1"><small>TODAY'S PROGRESS · ${new Date().toLocaleDateString("en-GB",{weekday:"long",day:"numeric",month:"short",year:"numeric"}).toUpperCase()}</small><div class="bar"><span style="width:${pct}%;background:var(--ok)"></span></div></div><b style="font-size:36px;color:${pct?"var(--ok)":"var(--ho)"}">${pct}%</b></div><div class="leg" style="margin-top:6px;gap:18px"><span>✓ Today's installed: <b>${inst}</b></span><span>⏰ Due today: <b>${dueT}</b></span><span>⚠ Overdue backlog: <b>${od}</b></span></div>`;
 $("kpis").innerHTML=[["Overall total jobs",n,"var(--tx)"],["Jobs in progress",cnt("In Progress"),"var(--ok)"],["Pending PO",pp,"var(--ho)"],["Pending follow-up",fu,"var(--wa)"],["Compliance rate",comp+"%",comp<80?"var(--ho)":"var(--ok)"],["Completed",cnt("Completed"),"var(--ok)"],["Total units",units+(tba?` <small>+${tba} TBA</small>`:""),"var(--ac)"]].map(k=>`<div class="card kpi" style="border-left:4px solid ${k[2]}"><small>${k[0]}</small><b>${k[1]}</b></div>`).join("");
 $("pct").textContent=n?`· ${Math.round(cnt("Completed")/n*100)}% completed`:"";
 $("bar").innerHTML=S.map(s=>`<span style="width:${n?cnt(s)/n*100:0}%;background:${C[s]}"></span>`).join("");
 $("leg").innerHTML=S.map(s=>`<span><i style="background:${C[s]}"></i>${s} ${cnt(s)}</span>`).join("");
 const q=$("q").value.toLowerCase(),fs=$("fs").value,fc=$("fc").value;
 const v=rows.filter(i=>(!fs||i.status===fs)&&(!fc||i.customer===fc)&&(!q||Object.values(i).join(" ").toLowerCase().includes(q))).sort((a,b)=>(a.planned||"9").localeCompare(b.planned||"9"));
 $("empty").hidden=!!n;
 $("rows").innerHTML=v.map(i=>`<tr><td>${esc(i.customer)}</td><td>${esc(i.project)}<br><small>${esc(i.site)}</small></td><td>${esc(i.line)}</td><td>${esc(i.supplier)}</td><td>${esc(i.reflow)}</td><td>${i.qty===""?"TBA":esc(i.qty)}</td><td>${esc(i.planned)||"<small>TBA</small>"}</td><td><select data-s="${esc(i.id)}" style="color:${C[i.status]}">${S.map(s=>`<option ${s===i.status?"selected":""}>${s}</option>`).join("")}</select></td><td style="white-space:normal;min-width:180px"><small>${esc(i.remark)}</small></td><td>${i.status==="Completed"?`<small>✓ Completed ${esc(i.completed)}</small>`:`<button data-c="${esc(i.id)}">✓ Mark completed</button>`} ${i.poDone?`<small>PO ✓ ${esc(i.poDone)}</small>`:`<button data-p="${esc(i.id)}">✓ PO done</button>`} <button data-e="${esc(i.id)}">Edit</button></td></tr>`).join("");
}
function showErr(m){$("err").style.display=m?"block":"none";$("err").textContent=m||""}
async function api(b){const r=await fetch(CFG.SCRIPT_URL,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify({token:CFG.TOKEN,...b})});const j=await r.json();if(!j.ok)throw new Error(j.error||"failed")}
async function load(){try{const r=await fetch(CFG.SCRIPT_URL+"?action=list&token="+encodeURIComponent(CFG.TOKEN));const j=await r.json();if(!j.ok)throw new Error(j.error);ver3=j.ver===3;rows=j.rows.map(r=>norm(cn(r)));live(true,"Live: Google Sheets · synced "+new Date().toLocaleTimeString([], {hour:"2-digit",minute:"2-digit",second:"2-digit"}));showErr(ver3?"":"View only: deploy the new Code.gs (v3) in Apps Script to enable Add / Edit / Mark completed.");render();$("cl").innerHTML=[...new Set(rows.map(i=>i.customer).filter(Boolean))].sort().map(c=>`<option value="${esc(c)}">`).join("")}catch(e){live(false,"Sync error");showErr("Cannot reach Google Sheets ("+e.message+"). Check SCRIPT_URL and TOKEN in index.html.")}}
let ver3=false;
async function act(b){if(!ver3){showErr("Saving is switched off until the new Code.gs (v3) is deployed, to protect your sheet columns.");return}try{await api(b);await load()}catch(e){showErr("Save failed: "+e.message)}}
$("rows").onclick=e=>{const t=e.target.dataset;if(t.e)openEdit(t.e);
 if(t.c){const d=prompt("Completion date (YYYY-MM-DD)",tdy());if(d)act({action:"complete",id:t.c,date:d})}
 if(t.p){const d=prompt("PO completed on (YYYY-MM-DD)",tdy());if(d)act({action:"po",id:t.p,date:d})}};
$("rows").onchange=e=>{const id=e.target.dataset.s;if(id)act({action:"status",id,status:e.target.value})};
$("fs").onchange=$("fc").onchange=$("q").oninput=render;$("rf").onclick=load;
$("exp").onclick=()=>{const k=["customer","project","site","line","supplier","reflow","qty","planned","completed","status","poDone","remark"],csv=[k.join(",")].concat(rows.map(r=>k.map(x=>'"'+String(r[x]??"").replace(/"/g,'""')+'"').join(","))).join("\n"),a=document.createElement("a");a.href=URL.createObjectURL(new Blob([csv],{type:"text/csv"}));a.download="vcam-installations.csv";a.click()};
let editId=null;const fe=n=>$("f").elements[n];
$("add").onclick=()=>{editId=null;$("f").reset();fe("status").value="In Progress";$("dt").textContent="Add installation";$("del").hidden=true;$("dlg").showModal()};
function openEdit(id){const r=rows.find(x=>x.id===id);if(!r)return;editId=id;
 const m={customer:r.customer,project:r.project,site:r.site,line:r.line,supplier:r.supplier,reflow:r.reflow,stopper:r.part,qty:r.qty,planned:r.planned,engineer:r.engineer,status:r.status,po:r.po,remark:r.rem};
 for(const k in m)fe(k).value=m[k]??"";$("dt").textContent="Edit installation";$("del").hidden=false;$("dlg").showModal()}
$("f").onsubmit=e=>{if(e.submitter?.value!=="save")return;const g=n=>fe(n).value.trim();
 const d={customer:g("customer"),project:g("project"),site:g("site"),line:g("line"),supplier:g("supplier"),model:g("reflow"),part:g("stopper"),qty:g("qty"),owner:g("engineer"),status:g("status"),po:g("po"),remarks:g("remark")};
 if(!editId){d.date=g("planned");d.tba=d.date?"FALSE":"TRUE"}else if(g("planned")){d.date=g("planned");d.tba="FALSE"}
 act({action:editId?"edit":"add",id:editId,data:d})};
$("del").onclick=()=>{if(editId&&confirm("Delete this installation from the Google Sheet? This cannot be undone.")){$("dlg").close();act({action:"delete",id:editId})}};
render();load();setInterval(load,CFG.REFRESH_MS);
</script></body></html>
